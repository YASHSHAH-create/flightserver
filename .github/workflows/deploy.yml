name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            export PATH=/root/.nvm/versions/node/v20.20.2/bin:$PATH
            cd /usr/code/yashshah/flightserver
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev
            pm2 restart index --update-env
            sleep 4
            pm2 describe index | grep -q online
            ss -tln | grep -q ':8000'
            echo "index (flightserver) deployed and healthy"
      - name: Telegram notify (success)
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -d parse_mode=HTML --data-urlencode "text=✅ <b>index (flight)</b> deploy LIVE ho gaya
          📝 $COMMIT_MSG
          👤 ${{ github.actor }}"
      - name: Telegram notify (failure)
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -d parse_mode=HTML --data-urlencode "text=❌ <b>index (flight)</b> DEPLOY FAILED — app purane version pe hi chal rahi hai
          📝 $COMMIT_MSG
          👤 ${{ github.actor }}
          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
