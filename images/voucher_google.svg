<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
    </linearGradient>
    <filter id="glass" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="5" dy="5" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="5" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="380" height="230" x="10" y="10" rx="20" ry="20" fill="url(#grad1)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Shine Effect -->
  <path d="M10 10 Q 200 100 390 10" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  <rect width="380" height="115" x="10" y="10" rx="20" ry="20" fill="rgba(255,255,255,0.1)" clip-path="inset(0 0 50% 0)" />

  <!-- Text -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="white" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Google Play</text>
  
  <!-- Subtext -->
  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8">GIFT VOUCHER</text>
</svg>